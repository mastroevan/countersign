[project]
name = "countersign"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pillow",
    "aiortc",
    "easypost",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "boto3-stubs[bedrock-runtime]",
    "types-Pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["countersign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
