[project]
name = "countersign"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=10",
    "aiortc>=1.9",
    "easypost",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "boto3-stubs[bedrock-runtime,s3]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["countersign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
